<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    font-family: "Inter", sans-serif;
    color: #fff;
    background: radial-gradient(120% 70% at 50% 35%, #0a2a9c 0%, #021258 55%, #010a35 100%);
    position: relative;
  }
  .scene { position: absolute; inset: 0; }

  /* header: avatar + name + badge + handle */
  .header { position: absolute; left: 80px; top: 270px; display: flex; align-items: center; gap: 22px; }
  .header img { width: 120px; height: 120px; border-radius: 50%; }
  .name { font-weight: 700; font-size: 46px; display: flex; align-items: center; gap: 10px; }
  .handle { font-style: italic; font-size: 34px; color: #a9b4d6; margin-top: 4px; }

  /* scene 1: hook */
  #hook { display: flex; flex-direction: column; justify-content: center; padding: 0 90px; }
  #hook h1 { font-size: 104px; line-height: 1.08; font-weight: 800; letter-spacing: -2px; }
  #hook h1 em { font-style: normal; color: #ffd84d; }
  #hook p { margin-top: 40px; font-size: 46px; color: #c9d3f2; font-weight: 500; }

  /* scenes 2-3: chat */
  #title { position: absolute; left: 80px; right: 80px; top: 430px; font-size: 52px; font-weight: 800; line-height: 1.15; }
  #title em { font-style: normal; color: #ffd84d; }
  .card {
    position: absolute; left: 50px; right: 50px; top: 590px; height: 980px;
    background: #f7f7f8; border-radius: 36px; overflow: hidden; color: #1d1d1f;
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
  }
  .bar { height: 78px; background: #ececef; display: flex; align-items: center; padding: 0 30px; gap: 12px; }
  .dot { width: 20px; height: 20px; border-radius: 50%; }
  .bar span { margin-left: 18px; font-size: 30px; color: #6e6e73; font-weight: 600; }
  .viewport { position: absolute; top: 78px; bottom: 0; left: 0; right: 0; overflow: hidden; }
  .feed { position: absolute; left: 0; right: 0; top: 0; padding: 34px 34px 40px; }
  .user {
    margin-left: auto; max-width: 860px; background: #2f6bff; color: #fff;
    border-radius: 34px 34px 8px 34px; padding: 26px 32px; font-size: 40px; line-height: 1.38;
    white-space: pre-wrap; width: fit-content;
  }
  .caret { display: inline-block; width: 4px; height: 44px; background: #fff; vertical-align: -8px; margin-left: 2px; }
  .ai { margin-top: 34px; display: flex; gap: 20px; align-items: flex-start; }
  .ai .av { flex: none; width: 64px; height: 64px; border-radius: 50%; background: #1d1d1f; display: grid; place-items: center; }
  .ai .body { font-size: 40px; line-height: 1.38; flex: 1; }
  .ai .line { opacity: 0; transform: translateY(14px); }
  .ai .line + .line { margin-top: 6px; }
  .ai .gap { height: 18px; }
  .ai .hl { background-image: linear-gradient(#ffe56b, #ffe56b); background-repeat: no-repeat; background-size: 0% 100%; border-radius: 6px; padding: 0 6px; margin-left: -6px; }
  .ai b { font-weight: 700; }
  .thinking { display: flex; gap: 12px; padding: 20px 0; }
  .thinking i { width: 18px; height: 18px; border-radius: 50%; background: #8e8e93; display: block; }

  .tag { display: inline-block; font-size: 38px; font-weight: 800; letter-spacing: 1px; padding: 8px 22px; border-radius: 14px; margin-right: 14px; vertical-align: 6px; }
  .tag.bad { background: #ff4d4f; color: #fff; }
  .tag.good { background: #2fd27a; color: #03250f; }
  .round.bad .ai .body { color: #6e6e73; }
  .round { position: absolute; inset: 0; }
  .ttl { position: absolute; left: 0; right: 0; top: 0; }

  /* list mode: numbered tricks, each with a mini chat */
  .item { position: absolute; inset: 0; }
  .item .head { position: absolute; left: 80px; right: 80px; top: 450px; display: flex; gap: 30px; align-items: flex-start; }
  .item .num { flex: none; width: 120px; height: 120px; border-radius: 50%; background: #ffd84d; color: #021258;
    font-size: 72px; font-weight: 900; display: grid; place-items: center; }
  .item .ititle { font-size: 64px; font-weight: 800; line-height: 1.1; letter-spacing: -1px; padding-top: 4px; }
  .item .ititle em { font-style: normal; color: #ffd84d; }
  .item .count { position: absolute; right: 80px; top: 300px; font-size: 38px; font-weight: 700; color: #a9b4d6; }
  .item .mini { position: absolute; left: 50px; right: 50px; top: 760px; background: #f7f7f8; border-radius: 36px;
    color: #1d1d1f; box-shadow: 0 30px 80px rgba(0,0,0,.45); overflow: hidden; }
  .item .mini .feed { position: relative; min-height: 600px; padding: 40px 38px 46px; }
  .item .mini .user, .item .mini .ai .body { font-size: 46px; line-height: 1.36; }
  .item .mini .ai { margin-top: 40px; }

  /* end card */
  #end { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 80px; }
  #end .big { font-size: 84px; font-weight: 800; line-height: 1.1; letter-spacing: -1px; }
  #end .big em { font-style: normal; color: #ffd84d; }
  #end .pill { margin-top: 60px; background: #fff; color: #021258; font-size: 48px; font-weight: 700; padding: 26px 50px; border-radius: 999px; }
  #end img { width: 170px; height: 170px; border-radius: 50%; margin-bottom: 50px; }
</style>
</head>
<body>
<div class="header" id="hdr"></div>

<div class="scene" id="hook"><h1 id="hookText"></h1><p id="hookSub"></p></div>

<div class="scene" id="chat">
  <div id="title"></div>
  <div class="card">
    <div class="bar"><i class="dot" style="background:#ff5f57"></i><i class="dot" style="background:#febc2e"></i><i class="dot" style="background:#28c840"></i><span>AI Chat</span></div>
    <div class="viewport" id="vp"></div>
  </div>
</div>

<div class="scene" id="list"></div>

<div class="scene" id="end">
  <img id="endAv">
  <div class="big" id="endBig"></div>
  <div class="pill" id="endPill"></div>
</div>

<script>
const BADGE = '<svg width="42" height="42" viewBox="0 0 40 40"><path fill="#1877f2" d="M20 1l4.2 3.4 5.3-.8 2 5 5 2-.8 5.3L39 20l-3.4 4.2.8 5.3-5 2-2 5-5.3-.8L20 39l-4.2-3.4-5.3.8-2-5-5-2 .8-5.3L1 20l3.4-4.2-.8-5.3 5-2 2-5 5.3.8z"/><path d="M12 20.5l5.2 5L28.5 14" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
// **bold**, ==highlight==, *accent* (yellow, in titles)
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/==(.+?)==/g, '<span class="hl">$1</span>').replace(/\*(.+?)\*/g, '<em>$1</em>');

let S, T, R;
const AI_AV = '<div class="av"><svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg></div>';
const TAGS = { bad: 'BAD PROMPT', good: 'BETTER PROMPT' };
window.setup = (spec, avatarUrl) => {
  S = spec;
  document.getElementById('hdr').innerHTML =
    `<img src="${avatarUrl}"><div><div class="name">The AI Edge Daily ${BADGE}</div><div class="handle">@theaiedgedaily</div></div>`;
  document.getElementById('endAv').src = avatarUrl;
  document.getElementById('hookText').innerHTML = fmt(spec.hook);
  document.getElementById('hookSub').textContent = spec.hookSub || '';
  document.getElementById('endBig').innerHTML = fmt(spec.endBig || 'Comment *TEAM* for 5 more prompts like this');
  // one call to action per post (Dave's plan): the pill only shows if a spec asks for it
  const pill = document.getElementById('endPill');
  pill.textContent = spec.endPill || '';
  pill.style.display = spec.endPill ? '' : 'none';
  if (spec.items) return setupList(spec);

  // a reel is one or more prompt -> answer rounds (e.g. bad prompt vs better prompt)
  const rounds = spec.rounds || [{ title: spec.title || spec.hook, prompt: spec.prompt, answer: spec.answer }];
  const vp = document.getElementById('vp'), title = document.getElementById('title');
  title.innerHTML = ''; vp.innerHTML = '';
  T = { hookEnd: 2.2, rounds: [] };
  let s0 = T.hookEnd;
  R = rounds.map((r, i) => {
    const el = document.createElement('div');
    el.className = 'round' + (r.tone ? ' ' + r.tone : '');
    el.innerHTML = `<div class="feed"><div class="user"></div><div class="ai">${AI_AV}<div class="body">
      <div class="thinking"><i></i><i></i><i></i></div>
      <div>${r.answer.map(l => l === '' ? '<div class="line gap"></div>' : `<div class="line">${fmt(l)}</div>`).join('')}</div>
      </div></div></div>`;
    vp.appendChild(el);
    const tt = document.createElement('div');
    tt.className = 'ttl';
    tt.innerHTML = (r.tone ? `<span class="tag ${r.tone}">${TAGS[r.tone]}</span>` : '') + fmt(r.title || '');
    title.appendChild(tt);
    const lines = [...el.querySelectorAll('.line:not(.gap)')];
    const typeStart = s0 + (i === 0 ? 0.4 : 0.6);
    const typeEnd = typeStart + clamp(r.prompt.length / 40, 1.2, 5.0);
    const ansStart = typeEnd + 1.0;
    const step = Math.min(1.0, (r.answerTime || 8.4) / lines.length);
    const ansEnd = ansStart + lines.length * step;
    const end = ansEnd + (r.hold != null ? r.hold : 1.8);
    const rt = { tone: r.tone || '', start: s0, typeStart, typeEnd, ansStart, step, ansEnd, end,
                 lineTimes: lines.map((_, j) => ansStart + j * step) };
    T.rounds.push(rt);
    s0 = end;
    return { el, tt, lines, r, rt, feed: el.querySelector('.feed'), user: el.querySelector('.user'),
             ai: el.querySelector('.ai'), think: el.querySelector('.thinking') };
  });
  T.endStart = Math.max(18.4, s0);
  T.total = T.endStart + 3.6;
  return T;
};

// ---- list mode -------------------------------------------------------------
let L;
function setupList(spec) {
  const list = document.getElementById('list'), n = spec.items.length;
  list.innerHTML = '';
  T = { hookEnd: 2.2, rounds: [] };
  let s0 = T.hookEnd;
  L = spec.items.map((it, i) => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `<div class="count">${i + 1} / ${n}</div>
      <div class="head"><div class="num">${i + 1}</div><div class="ititle">${fmt(it.title)}</div></div>
      <div class="mini"><div class="bar"><i class="dot" style="background:#ff5f57"></i><i class="dot" style="background:#febc2e"></i><i class="dot" style="background:#28c840"></i><span>AI Chat</span></div>
      <div class="feed"><div class="user"></div><div class="ai">${AI_AV}<div class="body">
      <div class="thinking"><i></i><i></i><i></i></div>
      <div>${it.answer.map(l => l === '' ? '<div class="line gap"></div>' : `<div class="line">${fmt(l)}</div>`).join('')}</div>
      </div></div></div></div>`;
    list.appendChild(el);
    const lines = [...el.querySelectorAll('.line:not(.gap)')];
    const typeStart = s0 + 0.7;
    const typeEnd = typeStart + clamp(it.prompt.length / 50, 1.0, 2.4);
    const ansStart = typeEnd + 0.6;
    const step = 0.55;
    const end = ansStart + (lines.length - 1) * step + 0.35 + (it.hold != null ? it.hold : 1.7);
    const rt = { tone: '', start: s0, typeStart, typeEnd, ansStart, end,
                 lineTimes: lines.map((_, j) => ansStart + j * step) };
    T.rounds.push(rt);
    s0 = end;
    return { el, it, rt, lines, user: el.querySelector('.user'), ai: el.querySelector('.ai'),
             think: el.querySelector('.thinking'), head: el.querySelector('.head'), mini: el.querySelector('.mini') };
  });
  T.endStart = Math.max(18.4, s0);
  T.total = T.endStart + 3.6;
  return T;
}

function renderList(t, cout) {
  const list = document.getElementById('list');
  list.style.opacity = ease((t - T.hookEnd) / 0.35) * (1 - cout);
  L.forEach((o, i) => {
    const rt = o.rt, next = L[i + 1];
    const inn = ease((t - rt.start) / 0.4), out = next ? ease((t - next.rt.start) / 0.3) : 0;
    o.el.style.opacity = (t < rt.start ? 0 : inn) * (1 - out);
    o.head.style.transform = `translateX(${(1 - inn) * 120 - out * 120}px)`;
    o.mini.style.transform = `translateY(${(1 - ease((t - rt.start - 0.15) / 0.45)) * 90}px)`;
    const p = o.it.prompt, k = Math.floor(p.length * clamp((t - rt.typeStart) / (rt.typeEnd - rt.typeStart)));
    const typing = (t >= rt.typeStart && t < rt.typeEnd) || (t < rt.typeEnd + 0.4 && Math.floor(t * 2.2) % 2 === 0);
    o.user.innerHTML = esc(p.slice(0, k)) + (typing ? '<span class="caret"></span>' : '');
    o.user.style.opacity = t < rt.typeStart - 0.1 ? 0 : 1;
    o.ai.style.opacity = t >= rt.typeEnd + 0.2 ? 1 : 0;
    o.think.style.display = t < rt.ansStart + 0.1 ? 'flex' : 'none';
    [...o.think.children].forEach((d, j) => d.style.opacity = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 9 - j * 1.1)));
    o.lines.forEach((l, j) => {
      const lt = rt.lineTimes[j], a = ease((t - lt) / 0.3);
      l.style.opacity = a; l.style.transform = `translateY(${(1 - a) * 14}px)`;
      l.querySelectorAll('.hl').forEach(h => h.style.backgroundSize = `${100 * ease((t - lt - 0.3) / 0.45)}% 100%`);
    });
  });
}

window.render = t => {
  const hook = document.getElementById('hook'), chat = document.getElementById('chat'), end = document.getElementById('end');
  // scene 1
  const h1 = document.getElementById('hookText'), sub = document.getElementById('hookSub');
  const hin = ease(t / 0.5), hout = ease((t - T.hookEnd) / 0.35);
  hook.style.opacity = hin * (1 - hout);
  h1.style.transform = `translateY(${(1 - hin) * 60 - hout * 80}px) scale(${0.94 + 0.06 * hin})`;
  sub.style.opacity = ease((t - 0.5) / 0.4);
  // chat scenes
  const cin = ease((t - T.hookEnd) / 0.45), cout = ease((t - T.endStart) / 0.4);
  if (S.items) {
    chat.style.opacity = 0;
    renderList(t, cout);
  } else {
  document.getElementById('list').style.opacity = 0;
  chat.style.opacity = cin * (1 - cout);
  chat.style.transform = `translateY(${(1 - cin) * 80}px)`;
  R.forEach((o, i) => {
    const rt = o.rt, next = R[i + 1];
    const vis = (i === 0 ? 1 : ease((t - rt.start) / 0.35)) * (next ? 1 - ease((t - next.rt.start) / 0.3) : 1);
    o.el.style.opacity = vis; o.tt.style.opacity = vis;
    o.tt.style.transform = `translateY(${(1 - (i === 0 ? 1 : ease((t - rt.start) / 0.35))) * 20}px)`;
    const p = o.r.prompt, k = Math.floor(p.length * clamp((t - rt.typeStart) / (rt.typeEnd - rt.typeStart)));
    const typing = (t >= rt.typeStart && t < rt.typeEnd) || (t < rt.typeEnd + 0.4 && Math.floor(t * 2.2) % 2 === 0);
    o.user.innerHTML = esc(p.slice(0, k)) + (typing ? '<span class="caret"></span>' : '');
    o.user.style.opacity = t < rt.typeStart - 0.1 ? 0 : 1;
    o.ai.style.opacity = t >= rt.typeEnd + 0.3 ? 1 : 0;
    o.think.style.display = t < rt.ansStart + 0.2 ? 'flex' : 'none';
    [...o.think.children].forEach((d, j) => d.style.opacity = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 9 - j * 1.1)));
    o.lines.forEach((l, j) => {
      const lt = rt.lineTimes[j], a = ease((t - lt) / 0.35);
      l.style.opacity = a; l.style.transform = `translateY(${(1 - a) * 14}px)`;
      l.querySelectorAll('.hl').forEach(h => h.style.backgroundSize = `${100 * ease((t - lt - 0.35) / 0.5)}% 100%`);
    });
    // auto-scroll so the newest line stays visible
    const vp = o.el.parentElement;
    const shown = o.lines.filter(l => parseFloat(l.style.opacity) > 0.01);
    let bottom = o.user.offsetTop + o.user.offsetHeight + 40;
    if (t >= rt.typeEnd + 0.3) bottom = Math.max(bottom, shown.length ? shown[shown.length - 1].offsetTop + shown[shown.length - 1].offsetHeight + 34 : 120);
    o.feed.style.transform = `translateY(${-Math.max(0, bottom + 40 - vp.clientHeight)}px)`;
  });
  }
  // header hidden on end card (avatar is shown big there)
  document.getElementById('hdr').style.opacity = 1 - cout;
  end.style.opacity = cout;
  end.style.transform = `scale(${0.96 + 0.04 * cout})`;
};
</script>
</body>
</html>
