<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: "Inter", sans-serif; color: #fff; position: relative;
    background: radial-gradient(120% 80% at 50% 25%, #0a2a9c 0%, #021258 55%, #010a35 100%);
  }
  .header { position: absolute; left: 80px; top: 70px; display: flex; align-items: center; gap: 20px; }
  .header img { width: 96px; height: 96px; border-radius: 50%; }
  .name { font-weight: 700; font-size: 38px; display: flex; align-items: center; gap: 8px; }
  .handle { font-style: italic; font-size: 28px; color: #a9b4d6; margin-top: 2px; }
  .count { position: absolute; right: 80px; top: 100px; font-size: 32px; font-weight: 700; color: #a9b4d6; }
  em { font-style: normal; color: #ffd84d; }

  /* cover */
  .cover { position: absolute; left: 80px; right: 80px; top: 330px; }
  .cover .kicker { display: inline-block; background: #ffd84d; color: #021258; font-weight: 800; font-size: 34px;
    letter-spacing: 2px; padding: 12px 26px; border-radius: 14px; margin-bottom: 44px; }
  .cover h1 { font-size: 112px; line-height: 1.04; font-weight: 800; letter-spacing: -3px; }
  .cover p { margin-top: 44px; font-size: 44px; color: #c9d3f2; font-weight: 500; line-height: 1.3; }
  .swipe { position: absolute; right: 80px; bottom: 90px; font-size: 40px; font-weight: 700; color: #fff;
    background: rgba(255,255,255,.12); padding: 20px 34px; border-radius: 999px; }

  /* prompt slides: content block centred between header and bottom */
  .stack { position: absolute; left: 70px; right: 70px; top: 210px; bottom: 90px; display: flex; flex-direction: column;
    justify-content: center; gap: 40px; }
  .head { display: flex; gap: 30px; align-items: flex-start; padding: 0 10px; }
  .num { flex: none; width: 132px; height: 132px; border-radius: 50%; background: #ffd84d; color: #021258;
    font-size: 80px; font-weight: 900; display: grid; place-items: center; }
  .title { font-size: 78px; font-weight: 800; line-height: 1.05; letter-spacing: -2px; padding-top: 6px; }
  .when { font-size: 42px; color: #c9d3f2; line-height: 1.35; padding: 0 10px; }
  .card { background: #fff; color: #1d1d1f; border-radius: 36px; padding: 44px 50px 50px; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  .card .lbl { font-size: 30px; font-weight: 800; letter-spacing: 2px; color: #2f6bff; margin-bottom: 20px; }
  .card .prompt { font-size: 50px; line-height: 1.4; }
  .card .prompt .ph { background: #fff1b8; border-radius: 8px; padding: 0 8px; font-weight: 600; }
  .tip { font-size: 36px; color: #c9d3f2; line-height: 1.35; padding: 0 10px; }
  .tip b { color: #fff; font-weight: 700; }

  /* end slide */
  .end { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 0 90px; }
  .end img { width: 180px; height: 180px; border-radius: 50%; margin-bottom: 54px; }
  .end .big { font-size: 92px; font-weight: 800; line-height: 1.08; letter-spacing: -2px; }
  .end .small { margin-top: 44px; font-size: 42px; color: #c9d3f2; line-height: 1.35; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const BADGE = '<svg width="36" height="36" viewBox="0 0 40 40"><path fill="#1877f2" d="M20 1l4.2 3.4 5.3-.8 2 5 5 2-.8 5.3L39 20l-3.4 4.2.8 5.3-5 2-2 5-5.3-.8L20 39l-4.2-3.4-5.3.8-2-5-5-2 .8-5.3L1 20l3.4-4.2-.8-5.3 5-2 2-5 5.3.8z"/><path d="M12 20.5l5.2 5L28.5 14" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
// *accent* -> yellow, [placeholder] -> highlighted, **bold**
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<em>$1</em>')
  .replace(/\[(.+?)\]/g, '<span class="ph">[$1]</span>');

window.show = (spec, i, avatar) => {
  const n = spec.slides.length + 2;
  const header = `<div class="header"><img src="${avatar}"><div><div class="name">The AI Edge Daily ${BADGE}</div><div class="handle">@theaiedgedaily</div></div></div>`;
  const count = `<div class="count">${i + 1} / ${n}</div>`;
  let html;
  if (i === 0) {
    html = header + `<div class="cover">${spec.kicker ? `<div class="kicker">${esc(spec.kicker)}</div>` : ''}
      <h1>${fmt(spec.title)}</h1><p>${fmt(spec.subtitle || '')}</p></div><div class="swipe">Swipe →</div>`;
  } else if (i === n - 1) {
    html = `<div class="end"><img src="${avatar}"><div class="big">${fmt(spec.endBig)}</div>
      <div class="small">${fmt(spec.endSmall || '')}</div></div>`;
  } else {
    const s = spec.slides[i - 1];
    html = header + count + `<div class="stack"><div class="head"><div class="num">${i}</div><div class="title">${fmt(s.title)}</div></div>
      <div class="when">${fmt(s.when)}</div>
      <div class="card"><div class="lbl">COPY THIS PROMPT</div><div class="prompt">${fmt(s.prompt)}</div></div>
      ${s.tip ? `<div class="tip">${fmt(s.tip)}</div>` : ''}</div>`;
  }
  document.getElementById('root').innerHTML = html;
  return n;
};
</script>
</body>
</html>
